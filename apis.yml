name: Rocket Internet
description: 'Rocket Internet SE is a Berlin-based internet company builder and technology investment
  firm founded by the Samwer brothers. It incubates and scales internet and technology ventures
  globally and invests through its venture arm, having built and backed more than 200 companies across
  six continents in e-commerce, marketplaces, fintech, food delivery, and consumer internet. Rocket
  Internet operates as a holding and operational-support platform rather than a product or API provider,
  so it exposes no public developer API, SDKs, or documentation surface. This profile was surfaced as a
  portfolio company of HV Capital and added to the API Evangelist network.'
